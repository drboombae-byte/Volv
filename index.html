
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Volvision Mods</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #090909, #171717, #101010);
            color: white;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 420px;
            text-align: center;
            padding: 35px 25px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 22px;
            box-shadow: 0 15px 50px rgba(0, 0, 0, 0.5);
        }

        .logo {
            font-size: 32px;
            font-weight: bold;
            margin-bottom: 12px;
            letter-spacing: 1px;
        }

        .logo span {
            color: #00aaff;
        }

        h1 {
            font-size: 25px;
            margin-bottom: 12px;
        }

        p {
            color: #bdbdbd;
            font-size: 15px;
            line-height: 1.6;
            margin-bottom: 25px;
        }

        .status {
            display: inline-block;
            background: rgba(0, 255, 120, 0.1);
            color: #00ff88;
            border: 1px solid rgba(0, 255, 120, 0.3);
            padding: 8px 14px;
            border-radius: 30px;
            font-size: 13px;
            margin-bottom: 25px;
        }

        .button {
            display: block;
            width: 100%;
            padding: 16px;
            background: linear-gradient(90deg, #007bff, #00b4ff);
            color: white;
            text-decoration: none;
            font-size: 16px;
            font-weight: bold;
            border-radius: 12px;
            transition: 0.3s;
        }

        .button:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(0, 150, 255, 0.3);
        }

        footer {
            margin-top: 25px;
            font-size: 12px;
            color: #666;
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="logo">
            VOLVISION <span>MODS</span>
        </div>

        <div class="status">
            ● We are here now
        </div>

        <h1>We've Moved!</h1>

        <p>
            Welcome to Volvision Mods.
            Visit our official website to explore the latest
            Android games, recomp projects, updates, and more.
        </p>

        <a class="button"
           href="https://www.volvisionmods.com"
           onclick="visitWebsite()">
            Click Here to Visit Volvision Mods
        </a>

        <footer>
            © 2026 Volvision Mods. All rights reserved.
        </footer>

    </div>

    <script>
        function visitWebsite() {
            window.location.href = "https://www.volvisionmods.com";
        }
    </script>

</body>
</html>
